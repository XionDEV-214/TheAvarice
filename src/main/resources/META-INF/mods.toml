modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# The wallet screen is built with ModularUI-Modern.
[[dependencies.${mod_id}]]
    modId="modularui"
    mandatory=true
    versionRange="[${modularui_version},)"
    ordering="AFTER"
    side="BOTH"

# Optional: Advent of Ascension 3 coins in the wallet's "Coins" tab.
[[dependencies.${mod_id}]]
    modId="aoa3"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Optional: Advent of Descension tokens in the wallet's "Tokens" tab.
[[dependencies.${mod_id}]]
    modId="aod3"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"
